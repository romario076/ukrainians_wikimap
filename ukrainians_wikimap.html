
<!DOCTYPE html>
<html lang="uk">
  <head>
    <!-- ── Basic Meta Tags ──────────────────────────────────────── -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ukrainians WikiMap — Наші Люди Всюди!</title>

    <!-- ── Project Favicon ──────────────────────────────────────── -->
    <!-- SVG використовується сучасними браузерами -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="icons/ukrainians_wikimap_favicon.svg"
    />

    <!-- ICO використовується як резервний формат -->
    <link
      rel="icon"
      type="image/x-icon"
      href="icons/ukrainians_wikimap_favicon.ico"
    />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="icons/ukrainians_wikimap_favicon.ico"
    />

    <!-- Іконка для Apple-пристроїв та ярлика на головному екрані -->
    <link
      rel="apple-touch-icon"
      href="icons/ukrainians_wikimap_favicon.png"
    />

    <!-- Колір інтерфейсу браузера на мобільних пристроях -->
    <meta name="theme-color" content="#0057B8" />

    <!-- ── Anti-Caching Meta Tags ───────────────────────────────── -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- ── Google Analytics ─────────────────────────────────────── -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-NRQ1JX8D3W">
    </script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag('js', new Date());
      gtag('config', 'G-NRQ1JX8D3W');
    </script>

    <!-- ── External Libraries ───────────────────────────────────── -->
    <script src="https://api.tiles.mapbox.com/mapbox-gl-js/v1.13.0/mapbox-gl.js"></script>

    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap-theme.min.css"
    />

    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/@deck.gl/jupyter-widget@~8.9.*/dist/index.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      #deck-container {
        width: 100vw;
        height: 100vh;
      }

      #deck-container canvas {
        z-index: 1;
        background: none;
        cursor: crosshair !important;
      }

      .button-container {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
        display: flex;
        flex-wrap: wrap;
      }

      .btn-nav {
        padding: 7px 15px;
        margin: 5px;
        border: none;
        border-radius: 5px;
        font-size: 12px;
        color: #ffffff;
        background-color: rgba(0, 123, 255, 0.8);
        cursor: pointer;
        transition:
          background-color 0.3s,
          box-shadow 0.3s;
      }

      .btn-nav.active,
      .btn-nav:focus {
        outline: none;
        background-color: rgb(0, 123, 255);
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.4);
      }

      /* ── Language Switcher ────────────────────────────────────── */
      .lang-switcher {
        display: flex;
        align-items: center;
        margin: 5px;
        overflow: hidden;
        border-radius: 5px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
      }

      .lang-btn {
        padding: 7px 11px;
        border: none;
        font-size: 12px;
        font-weight: bold;
        line-height: 1;
        color: rgba(255, 255, 255, 0.6);
        background-color: rgba(0, 80, 180, 0.7);
        cursor: pointer;
        transition:
          background-color 0.2s,
          color 0.2s;
      }

      .lang-btn.active {
        color: #ffffff;
        background-color: rgba(0, 123, 255, 1);
      }

      .lang-divider {
        width: 1px;
        height: 100%;
        background: rgba(255, 255, 255, 0.25);
      }

      iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        cursor: crosshair;
      }
    </style>

    <script>
      // ── Translations ────────────────────────────────────────────
      const TRANSLATIONS = {
        ua: {
          birth: '🟢 Місця народження',
          death: '⚫ Місця смерті',
          stats: '📊 Статистика',
          clustering: '🧩 Кластеризація',
          info: 'ℹ️ Інфо'
        },
        en: {
          birth: '🟢 Birthplaces',
          death: '⚫ Deathplaces',
          stats: '📊 Statistics',
          clustering: '🧩 Clustering',
          info: 'ℹ️ Info'
        }
      };

      // Current page URL without the lang and cache parameters
      let _currentSrc = '';

      function addLangParam(url, lang) {
        // Унікальна мітка часу запобігає кешуванню сторінок в iframe
        const cacheBuster = Date.now();

        try {
          const parsedUrl = new URL(url, window.location.href);

          parsedUrl.searchParams.set('lang', lang);
          parsedUrl.searchParams.set('_v', cacheBuster);

          return parsedUrl.href;
        } catch (error) {
          const separator = url.includes('?') ? '&' : '?';

          return (
            url +
            separator +
            'lang=' +
            encodeURIComponent(lang) +
            '&_v=' +
            cacheBuster
          );
        }
      }

      function stripLang(url) {
        try {
          const parsedUrl = new URL(url, window.location.href);

          parsedUrl.searchParams.delete('lang');
          parsedUrl.searchParams.delete('_v');

          return parsedUrl.href;
        } catch (error) {
          return url.replace(/[?&](lang|_v)=[^&]*/g, '');
        }
      }

      function getCurrentLang() {
        return localStorage.getItem('wikimap_lang') || 'ua';
      }

      function setLang(lang) {
        localStorage.setItem('wikimap_lang', lang);

        // Update language button states
        document.querySelectorAll('.lang-btn').forEach((button) => {
          button.classList.toggle(
            'active',
            button.dataset.lang === lang
          );
        });

        // Update navigation button labels
        const translations = TRANSLATIONS[lang];

        document
          .querySelectorAll('.btn-nav[data-key]')
          .forEach((button) => {
            const key = button.dataset.key;

            if (translations[key]) {
              button.textContent = translations[key];
            }
          });

        // Reload iframe using the selected language
        const frame = document.getElementById('content-frame');

        if (frame && _currentSrc) {
          frame.src = addLangParam(_currentSrc, lang);
        }
      }

      function loadPage(page, button) {
        const lang = getCurrentLang();

        _currentSrc = page;

        document.getElementById('content-frame').src =
          addLangParam(page, lang);

        document
          .querySelectorAll('.btn-nav.active')
          .forEach((element) => {
            element.classList.remove('active');
          });

        if (button) {
          button.classList.add('active');
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        // Set the first navigation button as active
        const firstButton =
          document.querySelector('.btn-nav[data-key]');

        if (firstButton) {
          firstButton.classList.add('active');
        }

        // Apply the previously selected language
        const savedLang = getCurrentLang();
        setLang(savedLang);

        // Load the first page using the selected language
        const frame = document.getElementById('content-frame');

        if (frame && frame.src) {
          _currentSrc = stripLang(frame.src);
          frame.src = addLangParam(_currentSrc, savedLang);
        }
      });
    </script>
  </head>

  <body>
    <div id="deck-container">
      <div class="button-container">
        <button
          class="btn-nav"
          data-key="birth"
          onclick="loadPage('./data/birth_search.html', this)">
          🟢 Місця народження
        </button>

        <button
          class="btn-nav"
          data-key="death"
          onclick="loadPage('./data/death_search.html', this)">
          ⚫ Місця смерті
        </button>

        <button
          class="btn-nav"
          data-key="stats"
          onclick="loadPage('./data/statistic.html', this)">
          📊 Статистика
        </button>

        <button class="btn-nav" data-key="clustering" onclick="loadPage('./data/clustering_map.html', this)">🧩 Кластеризація</button>

        <button
          class="btn-nav"
          data-key="info"
          onclick="loadPage('./data/info.html', this)">
          ℹ️ Інфо
        </button>

        <!-- Language Switcher -->
        <div class="lang-switcher">
          <button
            class="lang-btn"
            data-lang="ua"
            onclick="setLang('ua')">
            UA
          </button>

          <div class="lang-divider"></div>

          <button
            class="lang-btn"
            data-lang="en"
            onclick="setLang('en')">
            EN
          </button>
        </div>
      </div>

      <iframe
        id="content-frame"
        src="./data/birth_search.html"
        title="Ukrainians WikiMap">
      </iframe>
    </div>
  </body>
</html>
